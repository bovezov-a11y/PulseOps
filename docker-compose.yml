version: '3.8'

services:
  pulseops-db:
    image: timescale/timescaledb:latest-pg16
    container_name: pulseops-db
    environment:
      POSTGRES_DB: pulseops_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Password123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  pulseops-redis:
    image: redis:7-alpine
    container_name: pulseops-redis
    ports:
      - "6379:6379"
    restart: always

  pulseops-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pulseops-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

volumes:
  postgres_data: